name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run preflight guardrails
        run: ./scripts/preflight.sh

      - name: Build SpacesManager.app
        run: ./build.sh
